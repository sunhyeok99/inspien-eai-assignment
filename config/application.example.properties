# ------------------------------------------------------------------
# 실행 설정 예시. 실제 파일(config/application.properties)은 init 명령이 생성하며 Git 에서 제외된다.
# ------------------------------------------------------------------

# 정보 수신 API 로 받은 값 (init 이 자동 기록)
applicant.key=
# 영수증 파일명에 들어가는 참여자명 (한글)
applicant.name=홍길동

# REST Sender 포트 (POST http://localhost:8080/api/orders)
server.port=8080

# 배치 주기 (기본 300초 = 5분)
batch.interval.seconds=300
batch.initial-delay.seconds=10

# 영수증 파일 인코딩
receipt.charset=UTF-8

# 재시도 (연결 실패 등 일시적 장애에만 적용)
retry.max-attempts=3
retry.backoff-ms=1000
connect.timeout.seconds=10

# 서버가 PASV 응답으로 내부 IP 를 줄 때를 대비해 제어 연결 호스트로 데이터 연결
ftp.passive.use-control-host=true

# 접속 정보 보정 (config/conn/*.json 의 키 이름이 예상과 달라 조립이 안 될 때만 사용)
# order.db.url=jdbc:mysql://host:3306/db
# order.db.user=
# order.db.password=
# shipment.db.url=
# ftp.host=
# ftp.port=21
# ftp.remote-dir=/
